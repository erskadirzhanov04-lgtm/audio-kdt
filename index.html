<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Аудиоматериал</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #f5f7fa;
    font-family: Arial, sans-serif;
}

.player {
    max-width: 600px;
    margin: 30px auto;
    padding: 30px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
    text-align: center;
}

.icon {
    font-size: 50px;
    margin-bottom: 15px;
}

h2 {
    color: #243b5a;
}

p {
    color: #666;
}

audio {
    width: 100%;
    margin-top: 20px;
}
</style>

</head>

<body>

<div class="player">

<div class="icon">🎧</div>

<h2>Аудиоматериал</h2>

<p>Прослушайте аудиозапись</p>

<audio controls preload="metadata">
    <source src="krkonst.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает воспроизведение аудио.
</audio>

</div>

</body>
</html>
